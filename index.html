<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forma | Roadmap & Forecast</title>
  <meta name="theme-color" content="#f5f6f8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#roadmap" aria-label="Forma, roadmapa"><span class="brand-mark"><i data-lucide="layers-2"></i></span>forma<span class="brand-dot">.</span></a>
      <div class="workspace"><span class="workspace-avatar">D</span><div>Dashboard<small>Workspace lokalny</small></div><i data-lucide="chevrons-up-down"></i></div>
      <div class="nav-label">WORKSPACE</div>
      <nav aria-label="Nawigacja workspace">
        <button data-view="overview"><i data-lucide="layout-dashboard"></i>Przegląd</button>
        <button data-view="roadmap" class="active"><i data-lucide="chart-no-axes-gantt"></i>Roadmapa <span class="nav-tag">P85</span></button>
        <button data-view="capacity"><i data-lucide="calendar-days"></i>Capacity</button>
        <button data-view="teams"><i data-lucide="users"></i>Zespoły i kompetencje</button>
      </nav>
      <div class="sidebar-bottom"><span class="local-indicator"></span> Dane na tym urządzeniu<button class="icon-button" data-action="export" title="Eksportuj workspace" aria-label="Eksportuj workspace"><i data-lucide="download"></i></button></div>
      <div class="profile"><span class="profile-avatar">TY</span><div>Twój workspace<small>Planowanie portfolio</small></div><span class="profile-status"></span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">Workspace <i data-lucide="chevron-right"></i><strong id="breadcrumb">Roadmapa i prognozy</strong></div><div class="topbar-actions"><span id="save-status"><span class="local-indicator"></span>Zapisano lokalnie</span><button class="icon-button" data-action="import" title="Importuj workspace" aria-label="Importuj workspace"><i data-lucide="upload"></i></button><button class="icon-button" data-action="export" title="Eksportuj workspace" aria-label="Eksportuj workspace"><i data-lucide="download"></i></button><span class="top-avatar">TY</span></div></header>
      <div class="app-tabs" role="tablist" aria-label="Zakładki dashboardu"><button role="tab" data-view="overview" aria-selected="false"><i data-lucide="layout-dashboard"></i>Dashboard</button><button role="tab" data-view="roadmap" aria-selected="true" class="active"><i data-lucide="chart-no-axes-gantt"></i>Roadmapa i prognozy<span class="tab-dot"></span></button></div>
      <main id="app"></main>
      <footer><span>FORMA / PORTFOLIO PLANNING</span><span id="footer-meta">Monte Carlo · 1 500 symulacji · P85</span></footer>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="jstat.min.js"></script>
  <script src="lucide.min.js"></script>
  <script src="forecast.js"></script>
  <script src="app.js"></script>
</body>
</html>
