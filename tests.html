<!doctype html>
<html lang="pl">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forma | Testy silnika</title>
<style>body{font:14px monospace;max-width:900px;margin:40px auto;padding:20px;background:#f6f7f9;color:#20252c}li{padding:8px}.pass{color:#147d61}.fail{color:#b85349}</style>
<h1>Testy silnika Monte Carlo</h1>
<p id="summary"></p><ol id="results"></ol>
<script src="jstat.min.js"></script>
<script src="forecast.js"></script>
<script src="shared-store.js"></script>
<script>
  const base = () => ({ horizon: '2026-11-01', teams: [{ id: 'team', skills: ['skill'], capacity: { '2026-11': { skill: 21 } } }], initiatives: [{ id: 'initiative', start: '2026-11-01', items: [{ id: 'first', teamId: 'team', skillId: 'skill', min: 5, max: 5, fixed: true, deadline: '2026-11-06' }] }] });
  const assert = (condition, message) => { if (!condition) throw Error(message || 'Assertion failed'); };
  let passed = 0;
  let failed = 0;
  const test = (name, run) => { const row = document.createElement('li'); try { run(); passed++; row.className = 'pass'; row.textContent = 'PASS: ' + name; } catch (error) { failed++; row.className = 'fail'; row.textContent = 'FAIL: ' + name + ' / ' + error.message; } document.querySelector('#results').append(row); };
  test('5 osobodni, weekend pomijany, P85 = 6 listopada', () => { const result = Forecast.simulate(base(), 100); assert(result.results.first.p85 === '2026-11-06'); assert(result.results.first.probability === 1); });
  test('Zerowe capacity: brak ukonczenia, deadline 0%', () => { const state = base(); state.teams[0].capacity = {}; const result = Forecast.simulate(state, 100); assert(result.results.first.p85 === null); assert(result.results.first.completion === 0); assert(result.results.first.probability === 0); });
  test('Capacity wspoldzielone przez inicjatywy', () => { const state = base(); state.initiatives.push({ id: 'second-initiative', start: state.horizon, items: [{ ...state.initiatives[0].items[0], id: 'second' }] }); const result = Forecast.simulate(state, 100); assert(result.results.second.start === '2026-11-09'); assert(result.results.second.p85 === '2026-11-13'); });
  test('Zaleznosc blokuje osobna pule do kolejnego dnia roboczego', () => { const state = base(); state.teams[0].skills.push('other'); state.teams[0].capacity['2026-11'].other = 21; state.initiatives[0].items.push({ id: 'second', teamId: 'team', skillId: 'other', min: 5, max: 5, predecessor: 'first' }); const result = Forecast.simulate(state, 100); assert(result.results.second.start === '2026-11-09'); assert(result.results.second.p85 === '2026-11-13'); });
  test('Start elementu oraz start inicjatywy sa ograniczeniami', () => { const state = base(); state.initiatives[0].start = '2026-11-10'; state.initiatives[0].items[0].start = '2026-11-16'; const result = Forecast.simulate(state, 100); assert(result.results.first.start === '2026-11-16'); assert(result.results.first.p85 === '2026-11-20'); });
  test('Rozklad jednostajny min/max reaguje na probki', () => { const state = base(); state.initiatives[0].items[0].max = 10; const lower = Forecast.simulate(state, 100, () => 0); const upper = Forecast.simulate(state, 100, () => 1); assert(lower.results.first.p85 === '2026-11-06'); assert(upper.results.first.p85 === '2026-11-13'); });
  test('Wspolne P85 inicjatywy, portfolio i szansa wszystkich terminow', () => { const state = base(); state.initiatives[0].items.push({ id: 'second', teamId: 'team', skillId: 'skill', min: 5, max: 5, fixed: true, deadline: '2026-11-12' }); const result = Forecast.simulate(state, 100); assert(result.initiatives.initiative.p85 === '2026-11-13'); assert(result.portfolio.p85 === '2026-11-13'); assert(result.initiatives.initiative.probability === 0); assert(result.portfolio.probability === 0); });
  test('Praca przechodzi przez miesiac z capacity 0', () => { const state = base(); state.initiatives[0].items[0].min = 25; state.initiatives[0].items[0].max = 25; state.teams[0].capacity['2027-01'] = { skill: 21 }; const result = Forecast.simulate(state, 100); assert(result.results.first.p85 === '2027-01-06'); });
  test('Brak capacity poprzednika blokuje nastepce', () => { const state = base(); state.teams[0].skills.push('other'); state.teams[0].capacity = { '2026-11': { other: 21 } }; state.initiatives[0].items.push({ id: 'second', teamId: 'team', skillId: 'other', min: 5, max: 5, predecessor: 'first' }); const result = Forecast.simulate(state, 100); assert(result.results.second.completion === 0); assert(result.portfolio.p85 === null); });
  test('Rok przestepny i 12 miesiecy kalendarza', () => { const result = Forecast.calendar('2028-02-01'); assert(result.days.length === 366); assert(result.days.some(day => day.date === '2028-02-29')); assert(result.workdays['2028-02'] === 21); });
  test('P85 nie ignoruje prob nieukonczonych w horyzoncie', () => { const state = base(); state.initiatives[0].items[0].min = 1; state.initiatives[0].items[0].max = 100; let sample = 0; const result = Forecast.simulate(state, 100, () => sample++ < 84 ? 0 : 1); assert(result.results.first.completion === .84); assert(result.results.first.p50 !== null); assert(result.results.first.p85 === null); });
  test('Wspolne P85 moze byc pozniejsze niz P85 kazdego elementu', () => { const state = base(); state.teams[0].skills.push('other'); state.teams[0].capacity['2026-11'].other = 21; state.initiatives[0].items[0].max = 10; state.initiatives[0].items.push({ id: 'second', teamId: 'team', skillId: 'other', min: 5, max: 10 }); let draw = 0; const result = Forecast.simulate(state, 100, () => { const trial = Math.floor(draw / 2); const second = draw++ % 2; return (!second && trial < 10) || (second && trial >= 10 && trial < 20) ? 1 : 0; }); assert(result.results.first.p85 === '2026-11-06'); assert(result.results.second.p85 === '2026-11-06'); assert(result.initiatives.initiative.p85 === '2026-11-13'); });
  document.querySelector('#summary').textContent = passed + ' PASS / ' + failed + ' FAIL';
  document.body.dataset.failures = failed;
</script>
<script>
  (async function () {
    const asyncTest = async (name, run) => { const row = document.createElement('li'); try { await run(); passed++; row.className = 'pass'; row.textContent = 'PASS: ' + name; } catch (error) { failed++; row.className = 'fail'; row.textContent = 'FAIL: ' + name + ' / ' + error.message; } document.querySelector('#results').append(row); };
    const fake = () => {
      const database = { revision: 1, data: { value: 'initial' }, member: true, session: { user: { id: 'alice', email: 'alice@example.com' } }, fail: null, writes: [], beforeSave: null };
      const client = {
        auth: { getSession: async () => ({ data: { session: database.session } }), onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }), signOut: async () => ({}), signInWithOtp: async () => ({}) },
        from: table => ({ select() { return this; }, eq() { return this; }, async maybeSingle() { const data = table === 'roadmap_members' ? database.member ? { user_id: 'alice' } : null : { revision: database.revision, data: structuredClone(database.data) }; if (table === 'roadmap_workspaces' && database.beforeRead) await database.beforeRead(); return { data }; } }),
        rpc: async (name, args) => { database.writes.push(args); if (database.beforeSave) await database.beforeSave(); if (database.fail) return { error: database.fail }; if (args.expected_revision !== database.revision) return { error: { code: '40001', message: 'Conflict' } }; database.data = structuredClone(args.payload); return { data: ++database.revision }; }
      };
      return { database, client };
    };
    const setup = async options => { const { database, client } = fake(); if (options?.configure) options.configure(database); const remote = []; const store = SharedWorkspace.create({ client, validate: data => { if (!data || typeof data.value !== 'string') throw Error('Invalid'); }, onRemote: data => remote.push(data), pollMs: 0, debounceMs: 60000 }); await store.start(); return { database, store, remote }; };
    await asyncTest('Cloud: zatwierdzony uzytkownik pobiera wspolny plan', async () => { const { store, remote } = await setup(); try { assert(store.canEdit()); assert(remote[0].value === 'initial'); assert(store.getStatus().revision === 1); } finally { store.dispose(); } });
    await asyncTest('Cloud: niezalogowany nie odczytuje danych', async () => { const { store, remote } = await setup({ configure: db => { db.session = null; } }); try { assert(!store.canEdit()); assert(remote.length === 0); assert(store.getStatus().phase === 'signed-out'); } finally { store.dispose(); } });
    await asyncTest('Cloud: konto bez uprawnien nie odczytuje danych', async () => { const { store, remote } = await setup({ configure: db => { db.member = false; } }); try { assert(!store.canEdit()); assert(remote.length === 0); assert(store.getStatus().phase === 'denied'); } finally { store.dispose(); } });
    await asyncTest('Cloud: zapis potwierdzony nowa wersja', async () => { const { store, database } = await setup(); try { store.queue({ value: 'edited' }); await store.flush(); assert(database.data.value === 'edited'); assert(store.getStatus().revision === 2); assert(!store.hasPending()); assert(database.writes[0].expected_revision === 1); } finally { store.dispose(); } });
    await asyncTest('Cloud: konflikt nie nadpisuje cudzego planu', async () => { const { store, database } = await setup(); try { database.data = { value: 'other-user' }; database.revision++; store.queue({ value: 'my-edit' }); await store.flush(); assert(store.getStatus().phase === 'conflict'); assert(store.hasPending()); assert(!store.canEdit()); assert(database.data.value === 'other-user'); await store.reload(); assert(store.canEdit()); assert(!store.hasPending()); assert(store.getStatus().revision === 2); } finally { store.dispose(); } });
    await asyncTest('Cloud: blad sieci zachowuje oczekujacy zapis', async () => { const { store, database } = await setup(); try { database.fail = { message: 'Offline' }; store.queue({ value: 'keep-me' }); await store.flush(); assert(store.getStatus().phase === 'error'); assert(store.hasPending()); database.fail = null; await store.retry(); assert(database.data.value === 'keep-me'); assert(!store.hasPending()); } finally { store.dispose(); } });
    await asyncTest('Cloud: zmiana podczas zapisu jest wysylana kolejno', async () => { const { store, database } = await setup(); try { let release; database.beforeSave = () => new Promise(resolve => { release = resolve; }); store.queue({ value: 'first' }); const flushing = store.flush(); store.queue({ value: 'latest' }); database.beforeSave = null; release(); await flushing; for (let turn = 0; turn < 5; turn++) await Promise.resolve(); assert(database.writes.length === 2); assert(database.writes[1].expected_revision === 2); assert(database.data.value === 'latest'); assert(!store.hasPending()); } finally { store.dispose(); } });
    await asyncTest('Cloud: pusty workspace nie publikuje danych samoczynnie', async () => { const { store, database, remote } = await setup({ configure: db => { db.revision = 0; db.data = null; } }); try { assert(store.getStatus().phase === 'empty'); assert(remote[0] === null); assert(database.writes.length === 0); store.queue({ value: 'chosen' }); await store.flush(); assert(database.revision === 1); } finally { store.dispose(); } });
    await asyncTest('Cloud: spozniony odczyt nie cofa potwierdzonego zapisu', async () => { const { store, database, remote } = await setup(); try { let release; database.beforeRead = () => new Promise(resolve => { release = resolve; }); globalThis.dispatchEvent(new Event('focus')); for (let turn = 0; turn < 5; turn++) await Promise.resolve(); assert(typeof release === 'function'); store.queue({ value: 'newer' }); await store.flush(); release(); for (let turn = 0; turn < 5; turn++) await Promise.resolve(); assert(store.getStatus().revision === 2); assert(remote.length === 1); assert(database.data.value === 'newer'); } finally { store.dispose(); } });
    await asyncTest('Cloud: cofniecie uprawnien blokuje zapis', async () => { const { store, database } = await setup(); try { database.fail = { code: '42501', message: 'Denied' }; store.queue({ value: 'edit' }); await store.flush(); assert(store.getStatus().phase === 'denied'); assert(!store.canEdit()); assert(database.data.value === 'initial'); } finally { store.dispose(); } });
    await asyncTest('Cloud: wylogowanie usuwa oczekujace zmiany', async () => { const { store } = await setup(); try { store.queue({ value: 'private' }); await store.logout(); assert(!store.hasPending()); assert(!store.canEdit()); assert(store.getStatus().session === null); } finally { store.dispose(); } });
    test('Cloud: sekretny klucz nie jest akceptowany', () => { let rejected = false; try { SharedWorkspace.validateConfig({ url: 'https://example.supabase.co', publishableKey: 'header.' + btoa(JSON.stringify({ role: 'service_role' })) + '.signature' }); } catch { rejected = true; } assert(rejected); SharedWorkspace.validateConfig({ url: 'https://example.supabase.co', publishableKey: 'sb_publishable_example' }); });
    document.querySelector('#summary').textContent = passed + ' PASS / ' + failed + ' FAIL';
    document.body.dataset.failures = failed;
    document.body.dataset.complete = 'true';
  })();
</script>
</html>
